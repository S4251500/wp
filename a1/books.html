<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books - BookVerse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
    <script defer src="./assets/js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="nav-logo">
            <a href="index.html">
                <img src="./assets/images/BookVerse.svg" alt="Logo" class="logo-img">
                <span class="site-title">BookVerse</span>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="index.html"><img src="./assets/images/home.png" class="nav-link-icon"
                            aria-hidden="true"></img>Home</a></li>
                <li><a href="books.html"><img src="./assets/images/browse.png" class="nav-link-icon"
                            aria-hidden="true"></img>Browse Books</a></li>
                <li><a href="gallery.html"><img src="./assets/images/gallery.png" class="nav-link-icon"
                            aria-hidden="true"></img>Gallery</a></li>
                <li><a href="add.html"><img src="./assets/images/addBook.png" class="nav-link-icon"
                            aria-hidden="true"></img>Add Book</a></li>
            </ul>
        </nav>
    </header>

    <main class="container content">
        <h1><img src="./assets/images/gallery.svg"></img> All Books</h1>

        <!-- Filter Section -->
        <div class="filter-card">
            <h2>Filter by Status <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle" type="button" id="filterDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        All Books
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="filterDropdown">
                        <li><a class="dropdown-item active" href="#" data-status="all">All Books</a></li>
                        <li><a class="dropdown-item" href="#" data-status="available">Available</a></li>
                        <li><a class="dropdown-item" href="#" data-status="sold">Sold</a></li>
                        <li><a class="dropdown-item" href="#" data-status="reserved">Reserved</a></li>
                    </ul>
                </div>
            </h2>
        </div>

        <!-- Books Display Section -->
        <div class="books-card">
            <ul class="books-list" id="booksList">
                <!-- Books will be dynamically rendered here -->
            </ul>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div><small>&copy; 2026 s4251500. Your Gateway to Books.</small></div>
        </div>
    </footer>
</body>

</html>

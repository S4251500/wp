<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Book - BookVerse</title>
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
    <script defer src="./assets/js/scripts.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="nav-logo">
            <a href="index.html">
                <img src="./assets/images/BookVerse.svg" alt="Logo" class="logo-img">
                <span class="site-title">BookVerse</span>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="index.html"><img src="./assets/images/home.png" class="nav-link-icon"
                            aria-hidden="true"></img>Home</a></li>
                <li><a href="books.html"><img src="./assets/images/browse.png" class="nav-link-icon"
                            aria-hidden="true"></img>Browse Books</a></li>
                <li><a href="gallery.html"><img src="./assets/images/gallery.png" class="nav-link-icon"
                            aria-hidden="true"></img>Gallery</a></li>
                <li><a href="add.html"><img src="./assets/images/addBook.png" class="nav-link-icon"
                            aria-hidden="true"></img>Add Book</a></li>
            </ul>
        </nav>
    </header>

    <main class="container content">
        <h1>Add Book</h1>
        <form class="card" id="addBookForm">
            <label for="title">Title</label>
            <input id="title" name="title" placeholder="Book title">
            <label for="cover">Cover file</label>
            <input type="file" id="cover" name="cover">
            <div id="coverMsg" class="text-muted"></div>
            <div style="margin-top:1rem;">
                <button type="button" class="btn"
                    onclick="if(showFileValidationMessage(document.getElementById('cover'), ['jpg','jpeg','png'], document.getElementById('coverMsg'))) { alert('File looks good'); }">Upload</button>
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div><small>&copy; 2026 s4251500. Your Gateway to Books.</small></div>
        </div>
    </footer>
</body>

</html>

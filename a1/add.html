<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Book - BookVerse</title>
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
    <script defer src="./assets/js/scripts.js"></script>
</head>

<body class="add-page">
    <header class="navbar">
        <div class="nav-logo">
            <a href="index.html">
                <img src="./assets/images/BookVerse.svg" alt="Logo" class="logo-img">
                <span class="site-title">BookVerse</span>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="index.html"><img src="./assets/images/home.png" class="nav-link-icon"
                            aria-hidden="true"></img>Home</a></li>
                <li><a href="books.html"><img src="./assets/images/browse.png" class="nav-link-icon"
                            aria-hidden="true"></img>Browse Books</a></li>
                <li><a href="gallery.html"><img src="./assets/images/gallery.png" class="nav-link-icon"
                            aria-hidden="true"></img>Gallery</a></li>
                <li><a href="add.html"><img src="./assets/images/addBook.png" class="nav-link-icon"
                            aria-hidden="true"></img>Add Book</a></li>
            </ul>
        </nav>
    </header>

    <main class="container content add-content">
        <h1 class="add-title"><img src="./assets/images/addBook.png" alt="">Add New Book</h1>
        <form class="card add-form" id="addBookForm">
            <div class="form-field full-width">
                <label for="book-title">Book Title</label>
                <input type="text" id="book-title" name="title" placeholder="Enter book title">
            </div>

            <div class="form-field full-width">
                <label for="author-name">Author Name</label>
                <input type="text" id="author-name" name="author" placeholder="Enter author name">
            </div>

            <div class="form-field full-width">
                <label for="genre">Genre</label>
                <select id="genre" name="genre">
                    <option value="" selected>Select a genre</option>
                    <option>Fiction</option>
                    <option>Non-Fiction</option>
                    <option>Science Fiction</option>
                    <option>Fantasy</option>
                </select>
            </div>

            <div class="form-field">
                <label for="publication-year">Publication Year</label>
                <input name="year" placeholder="2024">
            </div>

            <div class="form-field">
                <label for="price">Price ($)</label>
                <input name="price" placeholder="19.99">
            </div>

            <div class="form-field">
                <label for="isbn">ISBN</label>
                <input id="isbn" name="isbn" placeholder="978-1-234567-89-0">
            </div>

            <div class="form-field">
                <label for="condition">Book Condition</label>
                <select id="condition" name="condition">
                    <option value="" selected>Select condition</option>
                    <option>New</option>
                    <option>Good</option>
                    <option>Used</option>
                </select>
            </div>

            <div class="form-field full-width">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Describe the book..."></textarea>
            </div>

            <div class="form-field full-width">
                <label for="cover">Upload Cover Image</label>
                <input type="file" id="cover" name="cover" accept=".jpg,.jpeg,.png">
            </div>

            <div class="form-field full-width">
                <label for="availability">Availability Status</label>
                <select id="availability" name="availability">
                    <option selected>Available</option>
                    <option>Reserved</option>
                    <option>Sold</option>
                </select>
            </div>

            <label class="agreement" for="agreement">
                <input type="checkbox" id="agreement" name="agreement">
                <span>I agree that this book information is accurate and complete</span>
            </label>

            <button type="button" class="btn add-submit">Add Book to Collection</button>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div><small>&copy; 2026 s4251500. Your Gateway to Books.</small></div>
        </div>
    </footer>
</body>

</html>

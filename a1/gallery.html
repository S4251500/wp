<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery - BookVerse</title>
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
    <script defer src="./assets/js/scripts.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="nav-logo">
            <a href="index.html">
                <img src="./assets/images/BookVerse.svg" alt="Logo" class="logo-img">
                <span class="site-title">BookVerse</span>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="index.html"><img src="./assets/images/home.png" class="nav-link-icon"
                            aria-hidden="true"></img>Home</a></li>
                <li><a href="books.html"><img src="./assets/images/browse.png" class="nav-link-icon"
                            aria-hidden="true"></img>Browse Books</a></li>
                <li><a href="gallery.html"><img src="./assets/images/gallery.png" class="nav-link-icon"
                            aria-hidden="true"></img>Gallery</a></li>
                <li><a href="add.html"><img src="./assets/images/addBook.png" class="nav-link-icon"
                            aria-hidden="true"></img>Add Book</a></li>
            </ul>
        </nav>
    </header>


    <main class="container content">
        <h1><img src="./assets/images/galleryIcon.svg"></img>Book Cover Gallery</h1>
        <section class="gallery-grid" aria-label="Book cover gallery">
            <img src="./assets/images/covers/1.png" alt="Book cover 1">
            <img src="./assets/images/covers/2.png" alt="Book cover 2">
            <img src="./assets/images/covers/3.png" alt="Book cover 3">
            <img src="./assets/images/covers/4.png" alt="Book cover 4">
            <img src="./assets/images/covers/5.png" alt="Book cover 5">
            <img src="./assets/images/covers/6.png" alt="Book cover 6">
            <img src="./assets/images/covers/7.png" alt="Book cover 7">
            <img src="./assets/images/covers/8.png" alt="Book cover 8">
            <img src="./assets/images/covers/9.png" alt="Book cover 9">
            <img src="./assets/images/covers/10.png" alt="Book cover 10">
            <img src="./assets/images/covers/11.png" alt="Book cover 11">
            <img src="./assets/images/covers/12.png" alt="Book cover 12">
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div><small>&copy; 2026 s4251500. Your Gateway to Books.</small></div>
        </div>
    </footer>
</body>

</html>
